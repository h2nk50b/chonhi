<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chợ Nhí – Trò chơi mua bán</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#fff7e6;--card:#fff;--tx:#2b2b3a;--mu:#777;--pr:#ff7a1a;--ok:#1fa35c;--no:#d6403b;--bd:#f0dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a24;--card:#2a2735;--tx:#f1eef8;--mu:#a8a3b8;--bd:#403b52}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{max-width:820px;margin:0 auto;padding:12px}
h1,h2,h3{margin:.3em 0}.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0}
button,input,select{font:inherit;border-radius:12px;border:2px solid var(--bd);padding:8px 12px;background:var(--card);color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;font-weight:700;cursor:pointer;margin:2px}button.g{background:var(--ok)}button.r{background:var(--no)}button.l{background:var(--bd);color:var(--tx)}
input{width:100%;margin:4px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.tabs button{white-space:nowrap}.tabs button.on{outline:3px solid var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.grid img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:40px}
.mu{color:var(--mu);font-size:14px}.bal{font-size:22px;font-weight:800;color:var(--ok)}.tag{padding:2px 8px;border-radius:99px;background:var(--bd);font-size:13px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#modal>div{background:var(--card);border-radius:20px;padding:16px;max-width:360px;width:100%;max-height:90vh;overflow:auto;text-align:center}
#modal svg{width:100%;height:auto;background:#fff;border-radius:8px}video{width:100%;border-radius:12px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;vertical-align:middle}.note{background:#fff3b0;color:#333;border-radius:12px;padding:8px 12px;margin:6px 0}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin:10px 0}.cell{border:1px dashed #888;padding:8px;text-align:center;background:#fff;color:#000;break-inside:avoid}.cell svg{width:100%;max-width:150px;height:auto}.cell .amt{font-size:22px;font-weight:800}.cell .cd{font:700 14px monospace;letter-spacing:1px}.cell .mu{color:#555;font-size:11px}
@media print{@page{size:A4;margin:8mm}.noprint{display:none!important}body{background:#fff}#app{max-width:none;padding:0}.sheet{grid-template-columns:repeat(4,1fr)}.cell{padding:4mm}}
</style></head><body><div id="app"></div><div id="modal"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s);let D,me=null,tab='';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=n=>'$'+Number(n).toFixed(2);
function load(){try{D=JSON.parse(localStorage.getItem('kidshop'))}catch(x){}
if(!D)D={users:[{id:'u0',name:'admin',pin:'1234',role:'admin',bal:0}],menu:[],orders:[],topups:[],tx:[],notes:[],n:1}}
function save(){try{localStorage.setItem('kidshop',JSON.stringify(D))}catch(x){}}
const id=()=>'i'+(D.n++)+Math.random().toString(36).slice(2,6);
const U=i=>D.users.find(u=>u.id===i)||{name:'?',bal:0};
const fd=t=>new Date(t).toLocaleString('vi-VN');
const RL={admin:'Quản trị',seller:'Người bán',buyer:'Người mua',shipper:'Shipper'};const SHIP=5;
function tx(u,type,amt,note){D.tx.push({t:Date.now(),uid:u,type,amt,note})}
function note(u,m,say){D.notes.push({uid:u,msg:m,t:Date.now(),read:false,say:say||''})}
function qr(txt){const q=qrcode(0,'M');q.addData(txt);q.make();return q.createSvgTag(6,4)}
function modal(h){$('#mb').innerHTML=h;$('#modal').style.display='flex'}
function closeM(){stopCam();$('#modal').style.display='none'}
$('#modal').onclick=ev=>{if(ev.target.id==='modal')closeM()};
function login(){const u=D.users.find(x=>x.name.toLowerCase()===$('#ln').value.trim().toLowerCase()&&x.pin===$('#lp').value);
if(!u)return alert('Sai tên hoặc mã PIN!');me=u.id;unlockVoice();tab=defTab(u);render()}
function logout(){me=null;render()}
function setTab(t){tab=t;render()}
function render(){load0();const A=$('#app');if(!me&&reg){regView();return}
if(!me){A.innerHTML=`<div class="card"><h1>🛒 Chợ Nhí</h1><p class="mu">Trò chơi mua bán cho bé. Đơn vị tiền: $</p><input id="ln" placeholder="Tên tài khoản"><input id="lp" type="password" placeholder="Mã PIN"><button onclick="login()">Đăng nhập</button><button class="l" onclick="startReg()">✨ Đăng ký tài khoản mới</button><p class="mu">Máy chủ: <b>${GAS?(srvV||'…'):'chế độ trình duyệt (chưa nhập URL /exec)'}</b><br>Lần đầu: tài khoản <b>admin</b>, PIN <b>1234</b> (hãy đổi sau khi tạo tài khoản).</p></div>`;return}
const u=U(me);const t=tabsFor(u);
const ns=D.notes.filter(n=>n.uid===me&&!n.read);setTimeout(announce,50);
A.innerHTML=`<div class="row noprint"><h2>${avatar(u)} ${e(u.name)} ${roleTags(u)}</h2><div>${u.role!='admin'?`<span class="bal">${$$(u.bal)}</span>`:''} ${has('seller')?`<button class="l" onclick="toggleVoice()">${voiceOn?'🔊':'🔇'}</button><button class="l" onclick="testVoice()">Thử giọng</button>`:''}<button class="l" onclick="logout()">Thoát</button></div></div>
${ns.map(n=>`<div class="note noprint">🔔 ${e(n.msg)} <button class="l" onclick="rd('${n.t}')">OK</button></div>`).join('')}
<div class="tabs noprint">${t.map(x=>`<button class="${tab==x[0]?'on':'l'}" onclick="setTab('${x[0]}')">${x[1]}</button>`).join('')}</div>${V[tab]()}`}
function load0(){}
function rd(t){D.notes.forEach(n=>{if(n.t==t&&n.uid===me)n.read=true});save();render()}
window.addEventListener('storage',()=>{if(!document.activeElement||document.activeElement.tagName!='INPUT'){load();render()}});
const TABS={admin:[['users','👥 Tài khoản'],['codes','🎟️ Mã nạp tiền'],['rep','📊 Báo cáo'],['mem','🖼️ Bộ nhớ ảnh']],
seller:[['orders','📦 Đơn hàng'],['menu','🍔 Thực đơn'],['stock','🏪 Tồn kho'],['pays','💰 Thanh toán'],['rep','📊 Báo cáo']],
shipper:[['jobs','🛵 Giao hàng'],['rep','📊 Báo cáo']],
buyer:[['menu','🍔 Menu'],['my','🧾 Đơn của tôi'],['canc','❌ Đã hủy'],['hist','💸 Chi tiêu'],['top','➕ Nạp tiền'],['addr','📍 Địa chỉ'],['rep','📊 Chi tiêu theo kỳ']]};
const img=m=>m.img?`<img loading="lazy" src="${m.img.startsWith('data:')?m.img:'https://drive.google.com/thumbnail?id='+encodeURIComponent(m.img)+'&sz=w600'}">`:'<div class="ph">🍽️</div>';
const stl={unpaid:'⏳ Chờ shipper nhận',shipping:'🚚 Đang giao',paid:'✅ Đã thanh toán',delivered:'🎉 Đã giao',cancelled:'❌ Đã hủy'};
// ---- Admin
function addUser(){const n=$('#nn').value.trim(),p=$('#np').value.trim();if(!n||!p)return alert('Nhập tên và PIN');
if(D.users.some(x=>x.name.toLowerCase()==n.toLowerCase()))return alert('Tên đã tồn tại');
const b=Math.max(0,+$('#nb').value||0),r=$('#nr').value;const uu={id:id(),name:n,pin:p,role:r=='admin'?'admin':'user',roles:r=='admin'?[]:[r],bal:b};D.users.push(uu);if(b)tx(uu.id,'adjust',b,'Số dư ban đầu');save();render()}
function adj(i){const u=U(i);const v=prompt('Số dư mới cho '+u.name+' ($):',u.bal);if(v===null)return;const n=+v;if(isNaN(n)||n<0)return alert('Số không hợp lệ');
tx(i,'adjust',n-u.bal,'Quản trị điều chỉnh');u.bal=n;save();render()}
function delU(i){if(confirm('Xóa tài khoản này?')){D.users=D.users.filter(u=>u.id!==i);save();render()}}
function chPin(i){const p=prompt('PIN mới:');if(p){U(i).pin=p;save();alert('Đã đổi PIN')}}
function mkCode(){const a=+$('#ca').value;if(!(a>0))return alert('Nhập số tiền > 0');const c=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
D.topups.push({code:c,amt:a,used:false,t:Date.now()});save();showCode(c)}
function showCode(c){const t=D.topups.find(x=>x.code===c);modal(`<h3>Nạp ${$$(t.amt)}</h3>${qr('KQR:TOP:'+c)}<p class="mu">Dùng 1 lần • ${t.used?'ĐÃ DÙNG':'Chưa dùng'}</p><button class="l" onclick="closeM()">Đóng</button>`);render()}
V={};
V.users=()=>`<div class="card"><h3>Tạo tài khoản</h3><div class="row"><input id="nn" placeholder="Tên" style="flex:1"><input id="np" placeholder="PIN" style="flex:1"></div><div class="row"><select id="nr"><option value="buyer">Người mua</option><option value="seller">Người bán</option><option value="shipper">Shipper</option><option value="admin">Quản trị</option></select><input id="nb" type="number" min="0" step="0.01" placeholder="Số dư ban đầu $" style="flex:1"><button onclick="addUser()">Tạo</button></div></div>
<div class="card"><table><tr><th>Tên</th><th>Vai trò</th><th>Số dư</th><th></th></tr>${D.users.map(u=>`<tr><td>${e(u.name)}</td><td>${u.role=='admin'?'Quản trị':roles(u).map(r=>RL[r]).join(', ')||'Thành viên'}</td><td>${u.role=='admin'?'–':$$(u.bal)}</td><td>${u.role!='admin'?`<button onclick="adj('${u.id}')">Số dư</button>`:''}<button class="l" onclick="chPin('${u.id}')">PIN</button>${u.id!=me?`<button class="r" onclick="delU('${u.id}')">Xóa</button>`:''}</td></tr>`).join('')}</table></div>`;
V.codes=()=>`<div class="card"><h3>Tạo mã QR nạp tiền (dùng 1 lần)</h3><div class="row"><input id="ca" type="number" min="0.01" step="0.01" placeholder="Số tiền $" style="flex:1"><button onclick="mkCode()">Tạo mã QR</button></div></div>
<div class="card"><table>${D.topups.slice().reverse().map(t=>`<tr><td>${t.code}</td><td>${$$(t.amt)}</td><td>${t.used?'Đã dùng bởi '+e(U(t.by).name):'Chưa dùng'}</td><td>${t.used?'':`<button onclick="showCode('${t.code}')">Xem QR</button>`}</td></tr>`).join('')||'<tr><td>Chưa có mã</td></tr>'}</table></div>`;
// ---- Scanner
let stream=null,raf=0;
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function scan(cb){window._cb=cb;modal(`<h3>📷 Quét mã QR</h3><video id="vd" playsinline muted></video><canvas id="cv" style="display:none"></canvas><p class="mu" id="sm">Đưa mã QR vào camera…</p>
<label class="mu">Hoặc chụp ảnh mã QR:<input type="file" accept="image/*" capture="environment" onchange="fromFile(this.files[0])"></label>
<input id="mt" placeholder="Hoặc nhập mã (KQR:...)"><button class="g" onclick="done($('#mt').value.trim())">OK</button><button class="l" onclick="closeM()">Hủy</button>`);
navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment'}}).then(s=>{stream=s;const v=$('#vd');v.srcObject=s;v.play();const c=$('#cv'),x=c.getContext('2d');
(function lp(){if(!stream)return;if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r&&r.data)return done(r.data)}raf=requestAnimationFrame(lp)})()}).catch(()=>{$('#vd').style.display='none';$('#sm').textContent=(/Zalo|FBAN|FBAV|Messenger|Instagram/i.test(navigator.userAgent)?'Bạn đang mở trong ứng dụng (Zalo/Facebook) nên camera bị chặn. Hãy mở link bằng Chrome hoặc Safari. ':'Chưa mở được camera (hãy bấm Cho phép). ')+'Bạn vẫn có thể chụp ảnh mã QR hoặc nhập mã.'})}
function fromFile(f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);r?done(r.data):alert('Không đọc được mã QR, thử chụp lại gần hơn.')};im.src=URL.createObjectURL(f)}
function done(t){const cb=window._cb;closeM();if(t)cb(t)}
// ---- Buyer
function handle(t){const p=t.split(':');if(p[0]!=='KQR')return alert('Mã QR không hợp lệ');const u=U(me);
if(p[1]==='TOP'){const c=D.topups.find(x=>x.code===p[2]);if(!c)return alert('Mã không tồn tại');if(c.used)return alert('Mã này đã được dùng!');
c.used=true;c.by=me;u.bal+=c.amt;tx(me,'topup',c.amt,'Nạp tiền bằng QR');save();alert('Nạp thành công '+$$(c.amt)+' 🎉');render()}
else if(p[1]==='PAY'){const o=D.orders.find(x=>x.id===p[2]);if(!o||o.buyerId!==me)return alert('Đơn này không phải của bạn');if(o.status!=='unpaid')return alert('Đơn đã xử lý rồi');
const amt=o.price*o.qty;if(Math.abs(amt-(+p[3]))>0.001)return alert('Số tiền trên mã không khớp!');if(u.bal<amt)return alert('Không đủ tiền! Cần '+$$(amt));
if(!confirm(`Thanh toán ${$$(amt)} cho "${o.name}" x${o.qty}?`))return;
u.bal-=amt;U(o.sellerId).bal+=amt;o.status='paid';o.paidAt=Date.now();tx(me,'pay',-amt,`Mua ${o.name} x${o.qty}`);tx(o.sellerId,'income',amt,`${u.name} mua ${o.name} x${o.qty}`);
note(o.sellerId,`${u.name} đã thanh toán ${$$(amt)} cho ${o.name} x${o.qty}`,`Bạn đã được thanh toán ${String(+amt.toFixed(2)).replace('.',' phẩy ')} đô la cho đơn hàng ${o.qty} ${o.name}`);save();alert('Thanh toán thành công ✅');render()}else alert('Mã QR không hợp lệ')}
function order(m){const q=Math.floor(+$('#q'+m).value||1);const it=D.menu.find(x=>x.id===m);if(!it||q<1||q>it.qty)return alert('Số lượng không hợp lệ (còn '+it.qty+')');
if(it.sellerId===me)return alert('Bạn không thể mua món của chính mình');it.qty-=q;D.orders.push({id:id(),buyerId:me,sellerId:it.sellerId,itemId:m,name:it.name,price:it.price,qty:q,status:'unpaid',t:Date.now()});save();tab='my';render();if(!(U(me).addr||{}).lat)alert('Bạn chưa lưu địa chỉ nhận hàng. Nếu muốn shipper giao tới, hãy vào tab 👤 Cá nhân để lưu địa chỉ.')}
function cancel(o){const x=D.orders.find(y=>y.id===o);if(!confirm('Hủy đơn này?'))return;if(x.status==='paid'){const a=x.price*x.qty;U(x.buyerId).bal+=a;U(x.sellerId).bal-=a;tx(x.buyerId,'refund',a,'Hoàn tiền '+x.name);tx(x.sellerId,'refund',-a,'Hoàn tiền '+x.name);note(x.buyerId,`Đơn ${x.name} bị hủy, đã hoàn ${$$(a)}`)}
const it=D.menu.find(m=>m.id===x.itemId);if(it)it.qty+=x.qty;x.status='cancelled';save();render()}
V.menu=()=>`<div class="grid">${D.menu.map(m=>`<div class="card">${img(m)}<b>${e(m.name)}</b><div class="mu">${e(U(m.sellerId).name)}</div><div><b>${$$(m.price)}</b> • còn ${m.qty}</div>${m.qty>0?`<input id="q${m.id}" type="number" min="1" max="${m.qty}" value="1"><button onclick="order('${m.id}')">Đặt món</button>`:'<span class="tag">Hết hàng</span>'}</div>`).join('')||'<p>Chưa có món nào.</p>'}</div>`;
const oc=(o,b)=>`<div class="card"><div class="row"><b>${e(o.name)} x${o.qty}</b><span>${$$(o.price*o.qty)}</span></div><div class="mu">${fd(o.t)} • ${b?'Người mua: '+e(U(o.buyerId).name):'Người bán: '+e(U(o.sellerId).name)}</div><span class="tag">${stl[o.status]}</span>`;
V.my=()=>D.orders.filter(o=>o.buyerId==me&&o.status!='cancelled').reverse().map(o=>oc(o)+(o.status=='unpaid'?`<div><button class="g" onclick="scan(handle)">📷 Quét QR thanh toán</button><button onclick="track('${o.id}')">📍 Địa chỉ nhận hàng</button><button class="r" onclick="cancel('${o.id}')">Hủy</button></div>`:'')+'</div>').join('')||'<p>Chưa có đơn.</p>';
V.canc=()=>D.orders.filter(o=>o.buyerId==me&&o.status=='cancelled').reverse().map(o=>oc(o)+'</div>').join('')||'<p>Không có đơn hủy.</p>';
V.hist=()=>`<div class="card"><b>Tổng đã chi: ${$$(-D.tx.filter(t=>t.uid==me&&t.type=='pay').reduce((a,t)=>a+t.amt,0))}</b></div><div class="card"><table>${D.tx.filter(t=>t.uid==me).reverse().map(t=>`<tr><td>${fd(t.t)}</td><td>${e(t.note)}</td><td style="color:var(--${t.amt<0?'no':'ok'})">${t.amt<0?'-':'+'}${$$(Math.abs(t.amt))}</td></tr>`).join('')||'<tr><td>Chưa có giao dịch</td></tr>'}</table></div>`;
V.top=()=>`<div class="card"><h3>Nạp tiền</h3><p>Chụp hoặc quét mã QR nạp tiền do quản trị cấp (mỗi mã chỉ dùng 1 lần).</p><button class="g" onclick="scan(handle)">📷 Quét / chụp mã QR</button></div>`;
// ---- Seller
function addItem(){const n=$('#in').value.trim(),p=+$('#ip').value,q=Math.floor(+$('#iq').value);if(!n||!(p>0)||!(q>=0))return alert('Nhập tên, đơn giá, số lượng');
D.menu.push({id:id(),sellerId:me,name:n,price:p,qty:q,img:window._img||''});window._img='';save();render()}
function pic(f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=300/Math.max(im.width,im.height,300)*(im.width>300||im.height>300?1:1);const s=Math.min(1,300/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);window._img=c.toDataURL('image/jpeg',.7);$('#pv').src=window._img;$('#pv').style.display='block'};im.src=URL.createObjectURL(f)}
function addQty(m){const v=prompt('Số lượng mới:');if(v===null)return;const n=Math.floor(+v);if(n>=0){D.menu.find(x=>x.id===m).qty=n;save();render()}}
function delItem(m){if(confirm('Xóa món?')){D.menu=D.menu.filter(x=>x.id!==m);save();render()}}
function payQR(o){const x=D.orders.find(y=>y.id===o),a=x.price*x.qty;modal(`<h3>Giao đơn ${$$(a)}</h3><p class="mu">${e(x.name)} x${x.qty} • ${e(U(x.buyerId).name)}</p>${qr(`KQR:PAY:${o}:${a.toFixed(2)}`)}<p class="mu">Bé quét mã này để thanh toán</p><button class="l" onclick="closeM()">Đóng</button>`)}
function deliver(o){D.orders.find(x=>x.id==o).status='delivered';note(D.orders.find(x=>x.id==o).buyerId,'Món của bạn đã được giao 🎉');save();render()}

function pimg(x,z){return x.startsWith('data:')?x:'https://drive.google.com/thumbnail?id='+encodeURIComponent(x)+'&sz=w'+(z||200)}
function avatar(u){return u.role=='admin'?'🛡️':u.photo?`<img class="av" src="${pimg(u.photo,100)}">`:'🧒'}
function av(i){const u=U(i);return u.photo?`<img class="av" style="width:32px;height:32px" src="${pimg(u.photo,100)}">`:''}
function roleTags(u){return u.role=='admin'?'<span class="tag">Quản trị</span>':(roles(u).map(r=>`<span class="tag">${RL[r]}</span>`).join(' ')||'<span class="tag">Thành viên</span>')}
V.smenu=sMenu;
function rpRole(u){return u.role=='admin'?'admin':(roles(u).includes(rp.r)?rp.r:roles(u)[0]||'buyer')}
function rpSet(k,v){if(k=='d'&&!v)return;rp[k]=v;render()}
function rolesBtn(u,R){const r=roles(u);return r.length>1?`<div>${r.map(x=>`<button class="${R==x?'':'l'}" onclick="rpSet('r','${x}')">${RL[x]}</button>`).join('')}</div>`:''}
V.me=()=>{const u=U(me),rs=roles(u);return `<div class="card" style="text-align:center">${u.photo?`<img src="${pimg(u.photo,300)}" style="width:120px;height:120px;border-radius:50%;object-fit:cover">`:'<div style="font-size:64px">🧒</div>'}<h2>${e(u.name)}</h2><div class="bal">${$$(u.bal)}</div><button class="g" onclick="scan(handle)">➕ Nạp tiền (quét QR)</button></div>
<div class="card"><h3>Đăng ký vai trò</h3><p class="mu">Một tài khoản có thể làm cả người mua, người bán và shipper. Mỗi lần đăng ký cần 10 giây để xét duyệt.</p>${[['buyer','🛍️ Người mua hàng'],['seller','🍳 Người bán hàng'],['shipper','🛵 Shipper']].map(x=>`<div class="row"><b>${x[1]}</b>${rs.includes(x[0])?'<span class="tag">✅ Đã đăng ký</span>':`<button onclick="regRole('${x[0]}')">Đăng ký</button>`}</div>`).join('')}</div>`+V.addr()};
V.welcome=()=>`<div class="card"><h2>🎉 Chào mừng ${e(U(me).name)}!</h2><p>Tài khoản đã được tạo. Bạn muốn nạp tiền ngay không?</p><button class="g" onclick="scan(handle)">📷 Quét QR nạp tiền</button><button class="l" onclick="setTab('me')">Để sau</button></div>`;
function regRole(r){const uid=me;if(roles(U(uid)).includes(r))return;if(window._pend)return alert('Đang xét duyệt, vui lòng đợi…');let n=10;window._pend=r;
modal(`<div style="font-size:48px">⏳</div><h3>Đang xét duyệt đăng ký ${RL[r]}</h3><p>Quá trình đăng ký mất <b>10 giây</b> để chờ xét duyệt.</p><div id="cd" style="font-size:64px;font-weight:800;color:var(--pr)">${n}</div><p class="mu">Vui lòng đợi, đừng thoát trang…</p>`);
const iv=setInterval(()=>{n--;const c=$('#cd');if(c)c.textContent=n;if(n>0)return;clearInterval(iv);window._pend=null;const u=U(uid);if(!D.users.includes(u))return;u.roles=roles(u).concat(r);save();
if(me===uid){render();okModal('Đăng ký thành công!',`<p>Bạn đã trở thành <b>${RL[r]}</b> 🎉</p>`);speak('Đăng ký thành công')}},1000)}
let reg=null;
function startReg(){reg={name:'',pin:'',photo:'',lat:null,lng:null,text:''};render()}
function regView(){const r=reg;$('#app').innerHTML=`<div class="card"><h2>✨ Đăng ký tài khoản</h2><input placeholder="Tên của bạn" value="${e(r.name)}" oninput="reg.name=this.value"><input type="password" placeholder="Mã PIN (số hoặc chữ)" value="${e(r.pin)}" oninput="reg.pin=this.value">
<h3>1. Ảnh chân dung</h3>${r.photo?`<img src="${r.photo}" style="width:140px;height:140px;object-fit:cover;border-radius:50%">`:'<div style="font-size:64px">🙂</div>'}
<label class="mu">📸 Chụp ảnh chân dung:<input type="file" accept="image/*" capture="user" onchange="regPhoto(this.files[0])"></label>
<h3>2. Địa chỉ nhận hàng</h3>${r.lat?`<p>✅ Đã có vị trí <span class="mu">${r.lat}, ${r.lng}</span></p>`:'<p class="mu">Chưa có vị trí</p>'}<button class="g" onclick="regGps()">📍 Lấy vị trí hiện tại</button><button onclick="regMap()">🗺️ Chọn trên bản đồ</button>
<input placeholder="Ghi chú địa chỉ (vd: Phòng 3, tầng 2)" value="${e(r.text)}" oninput="reg.text=this.value">
<div><button onclick="regDone()">✅ Hoàn tất đăng ký</button><button class="l" onclick="reg=null;render()">Quay lại</button></div></div>`}
function regPhoto(f){if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=320,m=Math.min(im.width,im.height);c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);reg.photo=c.toDataURL('image/jpeg',.7);render()};im.src=URL.createObjectURL(f)}
function regGps(){if(!navigator.geolocation)return alert('Thiết bị không hỗ trợ GPS');navigator.geolocation.getCurrentPosition(p=>{reg.lat=+p.coords.latitude.toFixed(6);reg.lng=+p.coords.longitude.toFixed(6);render()},()=>alert('Chưa lấy được vị trí: hãy bật GPS và cho phép vị trí, hoặc chọn trên bản đồ.'),{enableHighAccuracy:false,timeout:20000})}
async function pickMap(cur,set){modal(`<h3>🗺️ Chọn vị trí</h3><div id="mp" style="height:320px;border-radius:12px;background:var(--bd)"></div><p class="mu">Chạm vào bản đồ để chọn nơi nhận hàng.</p><button class="g" onclick="closeM();render()">Xong</button>`);$('#mb').parentElement.style.maxWidth='600px';
if(!await needMap())return;const st=cur||{lat:21.0285,lng:105.8542};const map=L.map('mp').setView([st.lat,st.lng],cur?17:13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);setTimeout(()=>map.invalidateSize(),250);
let m=cur?L.marker([cur.lat,cur.lng],{icon:mic('🏠')}).addTo(map):null;map.on('click',ev=>{const la=+ev.latlng.lat.toFixed(6),ln=+ev.latlng.lng.toFixed(6);if(m)m.setLatLng([la,ln]);else m=L.marker([la,ln],{icon:mic('🏠')}).addTo(map);set(la,ln)})}
function regMap(){pickMap(reg.lat?{lat:reg.lat,lng:reg.lng}:null,(la,ln)=>{reg.lat=la;reg.lng=ln})}
async function regDone(){const r=reg,n=(r.name||'').trim();if(!n||!r.pin)return alert('Hãy nhập tên và mã PIN');if(D.users.some(x=>x.name.toLowerCase()==n.toLowerCase()))return alert('Tên này đã có người dùng, hãy chọn tên khác');
if(!r.photo)return alert('Hãy chụp ảnh chân dung');if(!r.lat)return alert('Hãy khai báo địa chỉ (lấy vị trí hoặc chọn trên bản đồ)');
let ph=r.photo;if(GAS){try{const x=await call({a:'img',data:ph});if(x.error)return alert(x.error);ph=x.id}catch(x){return alert('Không tải được ảnh lên: '+x.message)}}
const u={id:id(),name:n,pin:r.pin,role:'user',roles:[],bal:0,photo:ph,addr:{lat:r.lat,lng:r.lng,t:Date.now(),text:(r.text||'').trim()},created:Date.now()};D.users.push(u);me=u.id;reg=null;tab='welcome';save();unlockVoice();render()}
// ---- Tờ mã nạp tiền: luôn đủ N mã chưa dùng, in được cả tờ
const cfg=()=>Object.assign({topAmt:5,topN:20},D.cfg||{});
function newCode(){return Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('')}
function ensureCodes(){const c=cfg(),un=D.topups.filter(x=>!x.used).length;if(un>=c.topN)return;const have=new Set(D.topups.map(x=>x.code));
for(let k=un;k<c.topN;k++){let code,g=0;do{code=newCode()}while(have.has(code)&&++g<50);have.add(code);D.topups.push({code,amt:c.topAmt,used:false,t:Date.now()})}save()}
function setCfg(){const a=+$('#cA').value,n=Math.floor(+$('#cN').value);if(!(a>0)||!(n>=1))return alert('Nhập mệnh giá > 0 và số mã ≥ 1');D.cfg={topAmt:a,topN:Math.min(60,n)};save();render()}
V.codes=()=>{ensureCodes();const c=cfg(),un=D.topups.filter(x=>!x.used),us=D.topups.filter(x=>x.used).reverse();
return `<div class="card noprint"><h3>🎟️ Tờ mã nạp tiền</h3><div class="row"><label class="mu">Mệnh giá mỗi mã ($)<input id="cA" type="number" min="0.01" step="0.01" value="${c.topAmt}"></label><label class="mu">Số mã mỗi tờ<input id="cN" type="number" min="1" max="60" value="${c.topN}"></label></div><div><button onclick="setCfg()">Lưu cài đặt</button><button class="g" onclick="window.print()">🖨️ In tờ mã</button></div><p class="mu">Luôn giữ đủ ${c.topN} mã chưa dùng: mã nào được dùng, hệ thống tự tạo mã mới thay thế. Hiện còn ${un.length} mã chưa dùng • đã dùng ${us.length}. Đổi mệnh giá chỉ áp dụng cho mã tạo mới.</p></div>
<div class="sheet">${un.slice(0,c.topN).map(t=>`<div class="cell">${qr('KQR:TOP:'+t.code)}<div class="amt">${$$(t.amt)}</div><div class="cd">${t.code}</div><div class="mu">Chợ Nhí • dùng 1 lần</div></div>`).join('')}</div>
<div class="card noprint"><h3>Mã đã dùng</h3><table>${us.map(t=>`<tr><td>${t.code}</td><td>${$$(t.amt)}</td><td>${e(U(t.by).name)}</td></tr>`).join('')||'<tr><td>Chưa có mã nào được dùng</td></tr>'}</table></div>`};
boot();
</script></body></html>
